name: CI

# No live market-data access occurs here: every backend test either uses
# FixtureProvider (zero HTTP) or mocks Nasdaq via httpx.MockTransport
# (backend/tests/test_nasdaq.py). nasdaq.py is never imported outside a few
# explicitly-marked tests, enforced by backend/tests/test_provider_boundary.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checks only read the repo; don't inherit the default token's write scopes.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # PRD section 4
      - name: Install dependencies
        working-directory: backend
        # A real venv, not a global pip install: ty only auto-discovers
        # installed packages' types via an activated VIRTUAL_ENV or a .venv
        # folder in the working directory -- without one, every third-party
        # import (scipy, fastapi, pydantic, ...) fails to resolve. Adding
        # the venv's bin dir to GITHUB_PATH makes plain `pip`/`ruff`/`ty`/
        # `pytest` in later steps resolve to it automatically.
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install -r requirements.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Type check (ty)
        working-directory: backend
        # Whole backend, tests included.
        run: ty check
      - name: Test
        working-directory: backend
        # test_performance.py's timings are hardware-sensitive and reported
        # separately (see its own comments for the measuring machine); this
        # keeps functional pass/fail here independent of runner performance.
        run: pytest --ignore=tests/test_performance.py
      - name: Daily heatmap script (fixture data, no network)
        working-directory: backend
        run: |
          pip install -r ../scripts/requirements.txt
          python ../scripts/daily_heatmap.py --fixture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # PRD section 4: Node 24.x. The floor is the CVE-2026-111497 fix.
          node-version: ">=24.22.1 <25"
          check-latest: true
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (biome)
        working-directory: frontend
        run: npm run lint
      - name: Type check + build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test
